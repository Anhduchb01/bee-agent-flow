# bee — app Slack cho WORKSPACE RIÊNG của anh (giai đoạn 1 → 3)
#
# Dán nguyên file này vào: api.slack.com/apps → Create New App
#   → From an app manifest → chọn workspace riêng → dán → Create.
#
# Set đủ scope ngay từ đầu là cố ý: thêm scope sau buộc phải cài lại app,
# và cài lại thì Slack cấp token xoxb- MỚI. Set dần = đổi token ba lần.
#
# Giai đoạn 1 thực ra chỉ dùng chat:write. Phần còn lại nằm sẵn đó, chưa
# có code nào chạm tới — Socket Mode bật nhưng không ai mở kết nối thì
# event đơn giản là không được giao. Vô hại.
#
# KHÔNG dùng manifest này cho workspace công ty. Xem manifest riêng ở
# giai đoạn 4: ở đó chỉ có app_mention + chat:write, và sự tách biệt do
# Slack cưỡng chế chứ không do code mình tự giữ.

display_information:
  name: bee
  description: Báo phiên, hỏi repo, ghi sổ — cửa thứ hai vào bee
  background_color: "#9A6205"

features:
  bot_user:
    display_name: bee
    # Nó là một systemd unit, sống 24/7 — khai đúng như vậy.
    always_online: true

oauth_config:
  scopes:
    bot:
      # ── giai đoạn 1: cái chuông. Chỉ cần đúng dòng đầu. ──────────────
      - chat:write
      - chat:write.public      # đăng vào kênh công khai mà không cần mời

      # ── giai đoạn 2: nghe được ───────────────────────────────────────
      - app_mentions:read      # nhận @bee
      - im:history             # đọc DM gửi cho bot
      - im:read
      - im:write               # bot mở được DM để trả lời
      - channels:history       # đọc kênh công khai nó ở trong
      - groups:history         # đọc kênh riêng tư nó được mời

      # ── giai đoạn 2–3: trả lời cho gọn ───────────────────────────────
      - reactions:write        # thả ✅ thay vì đăng thêm một tin
      - files:write            # gửi snapshot / evidence lên thread

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
  interactivity:
    # Bật sẵn cho nút bấm sau này. Với Socket Mode thì không cần request URL.
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
